server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    access_log /var/log/nginx/starit-access.log;
    error_log  /var/log/nginx/starit-error.log;
    root /usr/sites/starit_server;

    index index.php;

    location /api/ {
        root /usr/sites/starit_server;
        try_files $uri $uri/ /api/index.php?$args;
        location ~* \.php$ {
            try_files      $uri = 404;
            fastcgi_pass   server-php:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    location /backend/ {
            root /usr/sites/starit_server;
            try_files $uri $uri/ /backend/index.php?$args;
            location ~* \.php$ {
                try_files      $uri = 404;
                fastcgi_pass   server-php:9000;
                fastcgi_index  index.php;
                fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
                include        fastcgi_params;
            }
        }

	location / {
		# auth_basic           "closed site";
        # index index.php;
        # root backend/;
        root /usr/sites/starit_server;
        try_files $uri $uri/ /index.php?$query_string;
        index index.php;
    }

    location /customer/ {
        # rewrite ^(/customer).* '' break;
        proxy_pass http://app-node-customer:3000$uri;
        proxy_set_header Host $host;
    }

    location /customer-landing/ {
        proxy_pass http://landing-node-customer:3000;
        # proxy_set_header Host $host;
    }

    location /business-landing/ {
        proxy_pass http://landing-node-business:3000;
        # proxy_set_header Host $host;
    }

	location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
		expires 14d;
		add_header Cache-Control public;
	}

    location ~ \.php$ {
		# auth_basic           "closed site";
	    try_files $uri index.php =404;
		# fastcgi_param   APPLICATION_ENV  development;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass server-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
